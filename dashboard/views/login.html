<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arixa — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090b10;
  --surface: #11141c;
  --surface-hover: #161b26;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(88, 101, 242, 0.5);
  --text-main: #f0f3f8;
  --text-muted: #8b93a0;
  --discord-blurple: #5865f2;
  --discord-hover: #4752c4;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%;
  min-height: 100vh;
}
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 50% 25%, rgba(88, 101, 242, 0.08) 0%, transparent 60%);
  color: var(--text-main);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}
body::-webkit-scrollbar { width:0; height:0; display:none; }
html { scrollbar-width:none; }

.login-card {
  width: 100%;
  max-width: 410px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 38px 32px 34px;
  box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.04);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.brand-badge {
  width: 52px;
  height: 52px;
  margin: 0 auto 16px;
  border-radius: 14px;
  background: linear-gradient(145deg, #181d29, #131720);
  border: 1px solid rgba(88, 101, 242, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7289da;
  box-shadow: 0 8px 20px -4px rgba(88, 101, 242, 0.2);
}
.brand-badge svg {
  width: 26px;
  height: 26px;
}

.brand-title {
  font-family: "Poppins", sans-serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #ffffff 30%, #a4b3ca 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.brand-tagline {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 24px;
}

.login-error {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(248, 81, 73, 0.1);
  border: 1px solid rgba(248, 81, 73, 0.25);
  color: #ff9b94;
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 12.5px;
  font-weight: 500;
  text-align: left;
  line-height: 1.4;
  margin-bottom: 20px;
}
.login-error svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.login-btn {
  width: 100%;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--discord-blurple);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  font-size: 14.5px;
  font-weight: 600;
  font-family: "Poppins", "Inter", sans-serif;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 20px rgba(88, 101, 242, 0.32);
}
.login-btn:hover {
  background: var(--discord-hover);
  transform: translateY(-1.5px);
  box-shadow: 0 10px 24px rgba(88, 101, 242, 0.42);
}
.login-btn:active {
  transform: translateY(0);
  box-shadow: 0 4px 12px rgba(88, 101, 242, 0.25);
}
.login-btn svg {
  width: 20px;
  height: 20px;
  fill: #ffffff;
  flex-shrink: 0;
}

.login-footer {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  font-size: 11.5px;
  color: #6c7582;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.login-footer svg {
  width: 13px;
  height: 13px;
  color: #8b93a0;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
      <path d="M2 17l10 5 10-5"></path>
      <path d="M2 12l10 5 10-5"></path>
    </svg>
  </div>
  <h1 class="brand-title">Arixa</h1>
  <p class="brand-tagline">Sign in to manage and configure your Discord bot</p>

  <div class="login-error" id="loginError" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span id="loginErrorText"></span>
  </div>

  <button class="login-btn" id="discordLogin">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    <span>Login with Discord</span>
  </button>

  <div class="login-footer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>Secure Discord OAuth2 · No password required</span>
  </div>
</div>

<script>
var errText = "{{ERROR}}";
if (errText && errText.indexOf("{{") === -1) {
  var box = document.getElementById("loginError");
  var textEl = document.getElementById("loginErrorText");
  if (textEl) textEl.textContent = errText;
  else box.textContent = errText;
  box.style.display = "flex";
}
document.getElementById("discordLogin").addEventListener("click", function () {
  var btn = this;
  btn.disabled = true;
  btn.style.opacity = "0.7";
  window.location.href = "/api/auth/login";
});
window.addEventListener("pageshow", function () {
  var btn = document.getElementById("discordLogin");
  btn.disabled = false;
  btn.style.opacity = "1";
});
</script>
</body>
</html>
