<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090a0d;
  --text:#c8cfd9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%;height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","Segoe UI",Roboto,sans-serif;
  min-height:100%;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
h1{
  font-family:"Poppins","Inter",sans-serif;
  font-size:clamp(34px,7vw,56px);
  font-weight:800;
  letter-spacing:-.02em;
  background:linear-gradient(135deg,#ffffff 0%,#9fb4d8 45%,#5865f2 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}
.back{
  margin-top:26px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-decoration:none;
  color:#6b7280;
  font-size:13px;
  font-weight:600;
  transition:color .18s ease;
}
.back:hover{color:#c8cfd9}
.back svg{width:14px;height:14px}
</style>
</head>
<body>
  <h1>Coming soon</h1>
  <a class="back" href="/" target="_top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to dashboard
  </a>
</body>
</html>
