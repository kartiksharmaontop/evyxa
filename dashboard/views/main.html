<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090a0d;
  --text:#c8cfd9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{
  min-height:100%;
  height:100%;
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","Segoe UI",Roboto,sans-serif;
  font-size:14px;
  min-height:100%;
  min-height:100dvh;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::-webkit-scrollbar{width:0;height:0;display:none}
html{scrollbar-width:none}

.topbar{
  flex:0 0 auto;
  height:60px;
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  padding:0 20px;
  background:rgba(9, 11, 16, 0.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  z-index:100;
}
.topbar-content{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:4px;
  font-family:"Poppins","Segoe UI",sans-serif;
  white-space:nowrap;
  user-select:none;
  background:linear-gradient(135deg, #b8d4ff 0%, #6ea4fe 35%, #5865f2 75%, #3d46a8 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
}
.userbox{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.user-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  flex-shrink:0;
}
.user-name{
  color:#8b939f;
  font-size:12.5px;
  font-weight:600;
  font-family:"Inter","Segoe UI",sans-serif;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.logout-btn{
  background:#161a25;
  border:1px solid rgba(255,255,255,0.08);
  color:#8b939f;
  border-radius:10px;
  padding:7px 16px;
  font-size:12px;
  font-weight:700;
  font-family:"Inter","Segoe UI",sans-serif;
  cursor:pointer;
  transition:all .18s ease;
  flex-shrink:0;
}
.logout-btn:hover{
  border-color:rgba(88,101,242,0.4);
  color:#ffffff;
  background:#1d2232;
}

.page-container{
  flex:1 1 auto;
  width:100%;
  max-width:960px;
  margin:0 auto;
  padding:0 20px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.welcome{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:36px 20px 10px;
}
.welcome h1{
  font-size:48px;
  font-weight:700;
  letter-spacing:0.5px;
  font-family:"Poppins","Segoe UI",sans-serif;
  line-height:1.15;
  background:linear-gradient(135deg, #b8d4ff 0%, #6ea4fe 35%, #5865f2 75%, #3d46a8 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-block;
}
.welcome p{
  color:#9aa2b0;
  font-size:11px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-top:10px;
  font-family:"Inter","Segoe UI",sans-serif;
}

.view-plan-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:fit-content;
  margin:18px auto 0;
  background:#161a25;
  border:1px solid rgba(255,255,255,0.08);
  color:#8b939f;
  border-radius:12px;
  padding:10px 28px;
  font-size:13px;
  font-weight:700;
  font-family:"Poppins","Segoe UI",sans-serif;
  cursor:pointer;
  transition:all .18s ease;
  text-decoration:none;
}
.view-plan-btn:hover{
  border-color:rgba(88,101,242,0.4);
  color:#ffffff;
  background:#1d2232;
  transform:translateY(-1.5px);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}

.token-card{
  width:100%;
  max-width:480px;
  margin:18px auto 26px;
  text-align:center;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.token-field-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  text-align:left;
}
.token-label{
  display:block;
  color:#c8cfd9;
  font-size:13px;
  font-weight:600;
  letter-spacing:.5px;
  font-family:"Poppins","Segoe UI",sans-serif;
  margin-left:4px;
}
.token-text-input{
  width:100%;
  background:#11141d;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:13px 18px;
  color:#c8cfd9;
  font-size:14px;
  font-family:"Inter","Segoe UI",sans-serif;
  outline:none;
  transition:all .15s ease;
  box-sizing:border-box;
}
.token-text-input::placeholder{color:#4d5561}
.token-text-input:focus{
  border-color:#5865f2;
  box-shadow:0 0 0 3px rgba(88,101,242,.15);
}
.token-save-btn{
  width:100%;
  background:#161a25;
  border:1px solid rgba(255,255,255,0.08);
  color:#5f6775;
  border-radius:12px;
  padding:13px 24px;
  font-size:13.5px;
  font-weight:700;
  font-family:"Inter","Segoe UI",sans-serif;
  transition:all .2s ease;
  cursor:not-allowed;
  margin-top:2px;
}
.token-save-btn.active{
  background:#5865f2;
  border-color:#5865f2;
  color:#ffffff;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(88,101,242,.35);
}
.token-save-btn.active:hover{
  background:#4752c4;
  transform:translateY(-1.5px);
  box-shadow:0 6px 18px rgba(88,101,242,.45);
}
.token-save-btn.active:active{
  transform:translateY(0);
}
.token-note{
  font-size:12px;
  font-weight:600;
  color:#3fb950;
  margin-top:2px;
  opacity:0;
  transition:.25s;
  min-height:16px;
}
.token-note.show{opacity:1}

.bot-list{
  width:100%;
  max-width:480px;
  margin:0 auto 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.bot-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:#11141d;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:14px 20px;
  animation:pop .25s ease;
  transition:all .2s ease;
  cursor:pointer;
  user-select:none;
}
.bot-card:hover{
  background:#151924;
  border-color:rgba(88,101,242,0.35);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.bot-card.active{transform:scale(1.02)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bot-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,#5865f2,#9063fe);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.bot-avatar svg{width:22px;height:22px;stroke:#ffffff;fill:none;stroke-width:1.8}
.bot-info{min-width:0;flex:1}
.bot-name{
  color:#c8cfd9;
  font-size:14.5px;
  font-weight:600;
  font-family:"Poppins","Segoe UI",sans-serif;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bot-id{
  color:#8b939f;
  font-size:11px;
  font-weight:500;
  margin-top:3px;
  font-family:"Inter","Segoe UI",sans-serif;
  word-break:break-all;
}
.bot-chevron{
  margin-left:auto;
  width:16px;
  height:16px;
  flex-shrink:0;
  stroke:#8b939f;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:.15s;
}
.bot-card:hover .bot-chevron{
  stroke:#ffffff;
  transform:translateX(2px);
}
.bot-empty{
  grid-column:1 / -1;
  color:#4d5561;
  font-size:11px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  text-align:center;
  padding:16px 0;
  font-family:"Inter","Segoe UI",sans-serif;
}

.footer{
  flex:0 0 auto;
  padding:14px 20px 16px;
  text-align:center;
  color:#7b8390;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.6px;
  font-family:"Inter","Segoe UI",sans-serif;
  border-top:none;
  background:#090a0d;
  margin-top:auto;
}

@media (min-width:680px){
  .topbar{height:66px; padding:0 32px}
  .brand{font-size:24px}
  .welcome{padding:40px 20px 10px}
  .welcome h1{font-size:54px}
  .welcome p{font-size:12px; letter-spacing:1.8px}
  .view-plan-btn{padding:12px 34px; font-size:13.5px; margin:20px auto 0}
  .token-label{font-size:14px; margin-top:6px}
  .token-card{max-width:500px; margin:18px auto 30px}
  .token-text-input{padding:15px 22px; font-size:14.5px}
  .token-save-btn{padding:14px 26px; font-size:14px}
  .bot-list{
    max-width:820px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 380px));
    justify-content:center;
    gap:16px;
    margin:0 auto 24px;
  }
  .bot-card{padding:13px 22px}
  .footer{font-size:12px; padding:16px 20px 18px}
}

@media (min-width:1024px){
  .welcome h1{font-size:58px}
  .bot-list{max-width:920px}
  .topbar{padding:0 40px}
}

@media (max-width:480px){
  .topbar{padding:0 12px; height:56px}
  .brand{font-size:18px; letter-spacing:2px}
  .user-name{display:none}
  .user-avatar{width:28px; height:28px}
  .logout-btn{padding:5px 12px; font-size:10px}
  .welcome{padding:26px 14px 6px}
  .welcome h1{font-size:30px}
  .welcome p{font-size:9.5px; letter-spacing:1.2px}
  .view-plan-btn{padding:9px 24px; font-size:12px; margin:16px auto 0}
  .token-label{margin-top:4px; font-size:12.5px}
  .token-card{max-width:320px; margin:12px auto 22px}
  .token-text-input{padding:12px 18px; font-size:13px}
  .token-save-btn{padding:12px 20px; font-size:13px}
  .bot-list{max-width:320px; margin:0 auto 20px}
  .bot-card{padding:11px 16px}
}
@media (max-width:340px){
  .brand{font-size:15px; letter-spacing:1px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-content">
    <span class="brand" id="brandName">{{NAME}}</span>
    <div class="userbox">
      <img class="user-avatar" id="userAvatar" src="{{AVATAR}}" alt="avatar" />
      <span class="user-name" id="userName">{{USER}}</span>
      <a class="logout-btn" href="/docs" style="text-decoration:none;display:inline-flex;align-items:center;">Docs</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<div class="page-container">
  <main class="welcome">
    <h1>Welcome</h1>
    <p>Everything you need for your Discord bot, in one place.</p>
  </main>
  <a class="view-plan-btn" href="/plans">View Plan</a>
  <div class="token-card">
    <div class="token-field-group">
      <label class="token-label" for="botToken">Bot Token</label>
      <input type="password" class="token-text-input" id="botToken" placeholder="token.e.g" autocomplete="off" />
    </div>
    <div class="token-field-group" id="clientIdGroup" style="display:none;">
      <label class="token-label" for="clientId">Client ID</label>
      <input type="text" class="token-text-input" id="clientId" placeholder="Enter 17-20 digit Client ID" maxlength="20" autocomplete="off" />
    </div>
    <button id="saveToken" class="token-save-btn" disabled>Save</button>
    <div class="token-note" id="tokenNote"></div>
  </div>
  <div class="bot-list" id="botList">
    <div class="bot-empty" id="botEmpty">No Bots Found</div>
  </div>
</div>

<footer class="footer"><span id="footerText">{{FOOTER}}</span></footer>

<script>
var footerText = document.getElementById("footerText");
if (footerText.textContent.indexOf("{{") > -1) footerText.textContent = "Copyright 2026";
var brandName = document.getElementById("brandName");
if (brandName.textContent.indexOf("{{") > -1) brandName.textContent = "Evyxa";

document.getElementById("logoutBtn").addEventListener("click", function () {
  fetch("/api/auth/logout", { method: "POST" }).then(function () { window.location.href = "/login"; });
});

var botList = document.getElementById("botList");
var botEmpty = document.getElementById("botEmpty");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function makeCard(bot) {
  var card = document.createElement("div");
  card.className = "bot-card";
  card.setAttribute("data-id", bot.id);
  card.innerHTML =
    '<img class="bot-avatar" style="background:none" src="' + esc(bot.avatar) + '" alt="bot" width="44" height="44" />' +
    '<div class="bot-info">' +
      '<div class="bot-name">' + esc(bot.username) + "</div>" +
      '<div class="bot-id">' + esc(bot.id) + "</div>" +
    "</div>" +
    '<svg class="bot-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  card.addEventListener("click", function (e) {
    e.stopPropagation();
    window.location.href = "/bot/" + bot.id;
  });
  return card;
}

function hideEmpty() {
  if (botEmpty) botEmpty.style.display = "none";
}

fetch("/api/bots/list").then(function (r) {
  if (r.status === 401) { window.location.href = "/login"; return null; }
  return r.json();
}).then(function (d) {
  if (!d) return;
  if (d.ok && d.bots) d.bots.forEach(function (b) { botList.appendChild(makeCard(b)); hideEmpty(); });
  else if (d.error === "Not logged in") window.location.href = "/login";
}).catch(function () {});

var botTokenInput = document.getElementById("botToken");
var clientIdInput = document.getElementById("clientId");
var clientIdGroup = document.getElementById("clientIdGroup");
var saveTokenBtn = document.getElementById("saveToken");
var tokenNote = document.getElementById("tokenNote");

function decodeTokenId(token) {
  try {
    var part = String(token || "").trim().split(".")[0];
    if (!part || part.length < 15) return "";
    var padded = part + "==".slice((2 - part.length * 3) & 3);
    var decoded = atob(padded);
    return /^\d{17,21}$/.test(decoded) ? decoded : "";
  } catch (e) {
    return "";
  }
}

function checkValidation() {
  var tokenVal = botTokenInput.value.trim();
  var clientVal = clientIdInput.value.trim();

  if (tokenVal.length > 0) {
    clientIdGroup.style.display = "flex";
  } else {
    clientIdGroup.style.display = "none";
    clientIdInput.value = "";
    clientVal = "";
  }

  var tokenParts = tokenVal.split(".");
  var tokenValid = tokenParts.length === 3 && tokenParts[0].length >= 15 && tokenParts[1].length >= 4 && tokenParts[2].length >= 20;
  var clientValid = /^\d{17,20}$/.test(clientVal);

  var decodedId = decodeTokenId(tokenVal);
  var idsMatch = true;
  if (decodedId && clientValid) {
    idsMatch = (decodedId === clientVal);
  }

  if (tokenValid && clientValid && idsMatch) {
    saveTokenBtn.disabled = false;
    saveTokenBtn.classList.add("active");
  } else {
    saveTokenBtn.disabled = true;
    saveTokenBtn.classList.remove("active");
  }
}

botTokenInput.addEventListener("input", function () {
  checkValidation();
  var autoId = decodeTokenId(this.value.trim());
  if (autoId && !clientIdInput.value.trim()) {
    clientIdInput.value = autoId;
    checkValidation();
  }
});

clientIdInput.addEventListener("input", checkValidation);

saveTokenBtn.addEventListener("click", function () {
  if (this.disabled) return;
  var tokenVal = botTokenInput.value.trim();
  var clientVal = clientIdInput.value.trim();
  if (!tokenVal || !clientVal) return;

  var btn = this;
  btn.disabled = true;
  btn.classList.remove("active");
  btn.textContent = "Saving...";

  fetch("/api/bots/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: tokenVal, clientId: clientVal })
  }).then(function (r) { return r.json(); }).then(function (d) {
    btn.disabled = false;
    btn.textContent = "Save";
    if (d.ok) {
      botTokenInput.value = "";
      clientIdInput.value = "";
      checkValidation();
      tokenNote.textContent = "Bot saved successfully";
      tokenNote.style.color = "#3fb950";
      var existingCard = botList.querySelector('.bot-card[data-id="' + d.bot.id + '"]');
      var newCard = makeCard(d.bot);
      if (existingCard) {
        botList.replaceChild(newCard, existingCard);
      } else {
        botList.appendChild(newCard);
      }
      hideEmpty();
    } else {
      tokenNote.textContent = d.error || "Invalid token or Client ID";
      tokenNote.style.color = "#f85149";
      checkValidation();
    }
    tokenNote.classList.add("show");
    setTimeout(function () { tokenNote.classList.remove("show"); }, 3000);
  }).catch(function () {
    btn.disabled = false;
    btn.textContent = "Save";
    checkValidation();
    tokenNote.textContent = "Request failed";
    tokenNote.style.color = "#f85149";
    tokenNote.classList.add("show");
    setTimeout(function () { tokenNote.classList.remove("show"); }, 3000);
  });
});

document.addEventListener("click", function (e) {
  if (e.target.closest(".bot-card")) return;
  var cards = document.querySelectorAll(".bot-card");
  for (var i = 0; i < cards.length; i++) cards[i].classList.remove("active");
});
</script>
</body>
</html>
